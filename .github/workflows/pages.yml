# Renders the Quarto workshop site and deploys it with GitHub Pages.
# Runs in the prebuilt workshop image from rstudio-image.yml, which already
# carries Quarto and the R and Python dependencies the render needs.
name: Quarto Website

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # The public upstream workshop image, so a fork renders without building anything.
      # To render against your own build instead, see "Rendering the site" in the README.
      image: ghcr.io/a1eksb/operra-reproducibility:rstudio
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Render website
        run: quarto render
        working-directory: contents

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: contents/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
