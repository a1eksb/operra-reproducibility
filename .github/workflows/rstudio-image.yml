# Builds and publishes the workshop's RStudio container image to GitHub Container Registry.
name: RStudio (pyverse) Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - docker-compose.yaml
      - .github/workflows/rstudio-image.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/operra-reproducibility:rstudio
            ghcr.io/${{ github.repository_owner }}/operra-reproducibility:rstudio-${{ github.sha }}
          # Links the package to whichever repository published it, so a fork claims its own
          # rather than inheriting a hardcoded upstream one. Also keeps the link correct if
          # this repository is ever renamed again, which would change the image name too.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
