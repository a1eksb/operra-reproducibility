project:
  type: website
  render:
    - "**/*.qmd"
    - "!**/demo/nextflow/[0-9]*.qmd"
    - "!**/demo/snakemake/[0-9]*.qmd"
    # Workflow scratch directories may contain transient .qmd copies that
    # Nextflow / Snakemake stage and delete between Quarto's enumerate and stat.
    - "!**/demo/*/work/**"
    - "!**/demo/*/results/**"
    - "!**/demo/*/.snakemake/**"

website:
    title: Home
    page-navigation: true
    back-to-top-navigation: true
    page-footer:
        left: |
          Made with [![](https://quarto.org/quarto.png){fig-alt="Quarto" width=65px}](https://quarto.org/) \
          \ by the [Center for Reproducible Science and Research Synthesis](https://www.crs.uzh.ch/en.html)


        right: |
           <style>
           .github-lockup { height: 24px; width: auto; vertical-align: text-bottom; }
           .quarto-light .github-lockup-white,
           .quarto-dark .github-lockup-black { display: none; }
           </style>
           Free under the [CC BY international license 4.0 ](https://creativecommons.org/licenses/by/4.0/). \
           \ Source code on <a href="https://github.com/a1eksb/operra-reproducibility" aria-label="Source code on GitHub"><img class="github-lockup github-lockup-black" src="/assets/GitHub_Lockup_Black_Clearspace.svg" alt=""><img class="github-lockup github-lockup-white" src="/assets/GitHub_Lockup_White_Clearspace.svg" alt=""></a>


    favicon: 'assets/CRSnew_Logo.svg'

    # site-url is deliberately unset: without it Quarto emits no absolute canonical
    # URLs, so this site stays correct wherever it is served from -- including the
    # GitHub Pages site each fork publishes under its own github.io domain.
    repo-url: https://github.com/a1eksb/operra-reproducibility

    navbar:
        collapse-below: lg

        left:
          - text: "Instructions"
            href: ./instructions/index.qmd

        right:
          - text: "0. Introduction"
            href: ./module_0_introduction/slides/index.qmd

          - text: "1. Version Control"
            menu:
              - text: "Slides"
                href: ./module_1_version_control/slides/index.qmd
              - text: "Hands-on"
                href: ./module_1_version_control/demo/index.qmd

          - text: "2. Dynamic Reporting"
            menu:
              - text: "Slides"
                href: ./module_2_dynamic_reporting/slides/index.qmd
              - text: "Hands-on (R)"
                href: ./module_2_dynamic_reporting/demo_R/index.qmd
              - text: "Hands-on (Python)"
                href: ./module_2_dynamic_reporting/demo_py/index.qmd

          - text: "3. Workflow Management"
            menu:
              - text: "Slides"
                href: ./module_3_workflow_management/slides/index.qmd
              - text: "Hands-on"
                href: ./module_3_workflow_management/demo/index.qmd

          - text: "4. Containers"
            menu:
              - text: "Slides"
                href: ./module_4_containers/slides/index.qmd
              - text: "Hands-on"
                href: ./module_4_containers/demo/index.qmd

          - text: "5. Sharing & Publishing"
            menu:
              - text: "Slides"
                href: ./module_5_sharing_publishing/slides/index.qmd
              - text: "Hands-on"
                href: ./module_5_sharing_publishing/demo/index.qmd

format:
    html:
        grid:
          sidebar-width: 350px
        theme:
          light: flatly
          dark: darkly
        code-link: true
        toc: true
        toc-expand: 4
        code-copy: true

freeze: auto
